# Optimized Dockerfile for Spring Boot with Gradle
# Usage: docker build -t myapp:latest -f Dockerfile.gradle .

# Stage 1: Build
FROM gradle:7.5-jdk16 as builder

WORKDIR /app

# Copy gradle files
COPY gradle ./gradle
COPY gradlew .
COPY build.gradle settings.gradle ./

# Download dependencies
RUN ./gradlew dependencies --no-daemon -q

# Copy source code
COPY src ./src

# Build the application
RUN ./gradlew build -x test --no-daemon -q

# Stage 2: Runtime
FROM openjdk:16-jdk-slim

WORKDIR /app

# Create non-root user
RUN groupadd -r appuser && useradd -r -g appuser appuser

# Copy JAR from builder
COPY --from=builder /app/build/libs/*.jar app.jar

# Set ownership
RUN chown -R appuser:appuser /app

# JVM tuning for containers
ENV JAVA_OPTS="-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+UseG1GC"

# Spring Boot configuration
ENV SPRING_OUTPUT_ANSI_ENABLED=ALWAYS
ENV MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,metrics,prometheus

# Expose port
EXPOSE 8080

# Health check
HEALTHCHECK --interval=30s --timeout=3s --start-period=15s --retries=3 \
    CMD curl -f http://localhost:8080/actuator/health || exit 1

# Run as non-root user
USER appuser

# Run application
ENTRYPOINT exec java $JAVA_OPTS -jar app.jar
