# Kubernetes Ingress for Application Gateway Integration
# This Ingress automatically syncs with Azure Application Gateway via AGIC

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: three-tier-app-ingress
  namespace: three-tier-app
  annotations:
    # Use Application Gateway as ingress controller
    kubernetes.io/ingress.class: azure/application-gateway
    
    # Health probe configuration
    appgw.ingress.kubernetes.io/health-probe-path: /actuator/health
    appgw.ingress.kubernetes.io/health-probe-interval: "30"
    appgw.ingress.kubernetes.io/health-probe-unhealthy-threshold: "3"
    
    # Backend path configuration
    appgw.ingress.kubernetes.io/backend-path-prefix: "/"
    
    # Timeout configuration (in seconds)
    appgw.ingress.kubernetes.io/timeout-backend: "20"
    
    # SSL redirect (HTTP to HTTPS)
    appgw.ingress.kubernetes.io/ssl-redirect: "true"
    
    # Certificate management via cert-manager (optional)
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    
    # Connection draining timeout (in seconds)
    appgw.ingress.kubernetes.io/connection-draining-timeout: "30"
    
    # Hostname override (optional)
    appgw.ingress.kubernetes.io/hostname: "myapp.com"
    
    # Cookie affinity (optional - for session stickiness)
    # appgw.ingress.kubernetes.io/cookie-based-affinity: "Disabled"
    
    # Request routing configuration
    appgw.ingress.kubernetes.io/use-private-ip: "false"
    
    # WAF configuration (optional)
    # appgw.ingress.kubernetes.io/waf-policy: "/subscriptions/{subId}/resourceGroups/{rg}/providers/Microsoft.Network/ApplicationGatewayWebApplicationFirewallPolicies/{waf-policy-name}"

spec:
  # TLS/SSL Configuration
  tls:
  - hosts:
    - myapp.com
    - www.myapp.com
    - api.myapp.com
    - health.myapp.com
    # Secret name for certificate (auto-generated by cert-manager)
    secretName: myapp-tls-secret

  # Ingress Rules
  rules:
  # Root domain - Frontend
  - host: myapp.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: react-frontend
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: react-frontend
            port:
              number: 80

  # WWW subdomain - Frontend
  - host: www.myapp.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: react-frontend
            port:
              number: 80

  # API subdomain - Microservices
  - host: api.myapp.com
    http:
      paths:
      # User Service
      - path: /users
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 8081
      - path: /api/users
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 8081

      # Order Service
      - path: /orders
        pathType: Prefix
        backend:
          service:
            name: order-service
            port:
              number: 8082
      - path: /api/orders
        pathType: Prefix
        backend:
          service:
            name: order-service
            port:
              number: 8082

      # Payment Service
      - path: /payments
        pathType: Prefix
        backend:
          service:
            name: payment-service
            port:
              number: 8083
      - path: /api/payments
        pathType: Prefix
        backend:
          service:
            name: payment-service
            port:
              number: 8083

  # Health check subdomain
  - host: health.myapp.com
    http:
      paths:
      - path: /users
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 8081
      - path: /orders
        pathType: Prefix
        backend:
          service:
            name: order-service
            port:
              number: 8082
      - path: /payments
        pathType: Prefix
        backend:
          service:
            name: payment-service
            port:
              number: 8083

---

