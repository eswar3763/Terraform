apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: three-tier-app
  namespace: argocd
spec:
  description: 3-Tier Microservices Application Project
  
  # RBAC Roles
  roles:
    # Developers role - read-only and sync permissions
    - name: developers
      policies:
        - p, proj:three-tier-app:developers, applications, get, three-tier-app/*, allow
        - p, proj:three-tier-app:developers, applications, sync, three-tier-app/*, allow
        - p, proj:three-tier-app:developers, repositories, get, *, allow
      groups:
        - developers@example.com
    
    # Admin role - full permissions
    - name: admins
      policies:
        - p, proj:three-tier-app:admins, applications, *, three-tier-app/*, allow
        - p, proj:three-tier-app:admins, repositories, *, *, allow
        - p, proj:three-tier-app:admins, projects, *, *, allow
      groups:
        - admins@example.com
    
    # CI/CD role - sync only
    - name: cicd
      policies:
        - p, proj:three-tier-app:cicd, applications, sync, three-tier-app/*, allow
        - p, proj:three-tier-app:cicd, applications, get, three-tier-app/*, allow
  
  # Allowed source repositories
  sourceRepos:
    - 'https://github.com/eswar3763/Terraform.git'
    - 'https://charts.bitnami.com/bitnami'
  
  # Allowed destination clusters and namespaces
  destinations:
    - namespace: 'three-tier-app'
      server: 'https://kubernetes.default.svc'
    - namespace: 'argocd'
      server: 'https://kubernetes.default.svc'
    - namespace: 'three-tier-app-dev'
      server: 'https://kubernetes.default.svc'
    - namespace: 'three-tier-app-staging'
      server: 'https://kubernetes.default.svc'
  
  # Cluster resources allowed (creation)
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRole
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRoleBinding
    - group: ''
      kind: PersistentVolume
  
  # Namespace resources denied (prevent deletion)
  namespaceResourceBlacklist:
    - group: ''
      kind: ResourceQuota
    - group: ''
      kind: LimitRange
    - group: 'policy'
      kind: PodDisruptionBudget
