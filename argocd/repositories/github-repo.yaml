apiVersion: v1
kind: Secret
metadata:
  name: github-terraform-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: https://github.com/eswar3763/Terraform.git
  password: <GITHUB_PERSONAL_ACCESS_TOKEN>
  username: eswar3763
  insecure: "false"
  enableLFS: "true"

---
# Alternative: Using SSH (recommended for production)
apiVersion: v1
kind: Secret
metadata:
  name: github-terraform-repo-ssh
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: git@github.com:eswar3763/Terraform.git
  sshPrivateKey: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    <BASE64_ENCODED_PRIVATE_KEY>
    -----END OPENSSH PRIVATE KEY-----
  insecure: "false"
