apiVersion: v1
kind: Secret
metadata:
  name: github-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: https://github.com/eswar3763/Terraform.git
  # Method 1: Using Personal Access Token (PAT)
  password: <REPLACE_WITH_GITHUB_PAT>
  username: eswar3763
  insecure: "false"
  enableLFS: "true"
  
  # Method 2: Using SSH Key (More Secure - Uncomment and use instead of PAT)
  # sshPrivateKey: |
  #   -----BEGIN OPENSSH PRIVATE KEY-----
  #   ... base64-encoded SSH private key ...
  #   ... replace with your actual SSH private key content ...
  #   -----END OPENSSH PRIVATE KEY-----
