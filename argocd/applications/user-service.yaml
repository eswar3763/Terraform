apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-service
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: three-tier-app
  
  source:
    repoURL: https://github.com/eswar3763/Terraform.git
    targetRevision: main
    path: helm-charts/user-service
    
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
      
      parameters:
        - name: image.tag
          value: "1.0.0"
      
      releaseName: user-service
  
  destination:
    server: https://kubernetes.default.svc
    namespace: three-tier-app
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - RespectIgnoreDifferences=true
    
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  info:
    - name: Documentation
      value: https://github.com/eswar3763/Terraform/blob/main/HELM_ARGOCD_COMPLETE_SETUP_GUIDE.md
    - name: Chart
      value: https://github.com/eswar3763/Terraform/tree/main/helm-charts/user-service
