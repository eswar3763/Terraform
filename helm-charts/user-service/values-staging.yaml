# Staging environment overrides for user-service

replicaCount: 2

image:
  tag: "1.0.0-staging"
  pullPolicy: IfNotPresent

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "staging"
  - name: JAVA_OPTS
    value: "-Xms128m -Xmx256m"
  - name: LOG_LEVEL
    value: "INFO"

database:
  host: postgres-staging-service
  port: 5432
  name: three_tier_staging
  username: staginguser
  passwordSecret: postgres-staging-secret
  passwordKey: password

livenessProbe:
  initialDelaySeconds: 45
  periodSeconds: 15
  failureThreshold: 4

readinessProbe:
  initialDelaySeconds: 20
  periodSeconds: 8
  failureThreshold: 4

podDisruptionBudget:
  enabled: true
  minAvailable: 1
