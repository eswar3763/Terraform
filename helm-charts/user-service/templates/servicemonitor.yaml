# Prometheus ServiceMonitor for canary metrics
{{- if .Values.canary.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "user-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "user-service.labels" . | nindent 4 }}
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      {{- include "user-service.selectorLabels" . | nindent 6 }}
  
  endpoints:
    - port: http
      path: {{ .Values.canary.servicemonitor.metricsPath | default "/actuator/prometheus" }}
      interval: {{ .Values.canary.servicemonitor.interval | default "15s" }}
      scrapeTimeout: {{ .Values.canary.servicemonitor.scrapeTimeout | default "10s" }}
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
      scheme: http
{{- end }}
