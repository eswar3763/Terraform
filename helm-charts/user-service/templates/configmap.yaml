apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "user-service.fullname" . }}-config
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "user-service.labels" . | nindent 4 }}
data:
  application.yaml: |
    spring:
      application:
        name: user-service
      jpa:
        hibernate:
          ddl-auto: validate
        show-sql: false
        properties:
          hibernate:
            dialect: org.hibernate.dialect.PostgreSQL13Dialect
            jdbc:
              batch_size: 20
            order_inserts: true
            order_updates: true
      datasource:
        hikari:
          maximum-pool-size: 20
          minimum-idle: 5
          connection-timeout: 30000
          idle-timeout: 600000
          max-lifetime: 1800000
    logging:
      level:
        root: {{ .Values.logging.level }}
        com.example: DEBUG
      pattern:
        console: "[%d{ISO8601}] %-5p %c{1}:%L - %m%n"
    management:
      endpoints:
        web:
          exposure:
            include: health,metrics,prometheus
      metrics:
        export:
          prometheus:
            enabled: true
      health:
        livenessState:
          enabled: true
        readinessState:
          enabled: true
