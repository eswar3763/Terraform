apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "payment-service.fullname" . }}-config
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "payment-service.labels" . | nindent 4 }}
data:
  application.yaml: |
    spring:
      application:
        name: payment-service
      datasource:
        hikari:
          maximum-pool-size: 20
    logging:
      level:
        root: {{ .Values.logging.level }}
